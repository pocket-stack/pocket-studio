pre-commit:
  parallel: true
  commands:
    frontend-check:
      glob: "*.{js,ts,vue,json,css,html}"
      run: pnpm check:frontend
    rust-fmt:
      glob: "src-tauri/**/*.rs"
      run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
    rust-clippy:
      glob: "src-tauri/**/*.rs"
      run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
