[package]
name = "pocket-studio"
version = "0.1.0"
description = "The desktop bridge for the Pocket device ecosystem"
authors = ["PocketJS contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "pocket_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
thiserror = "2.0.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
