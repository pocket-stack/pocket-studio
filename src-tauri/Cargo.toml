[package]
name = "pocket-studio"
version = "0.1.0"
description = "The desktop bridge for the Pocket device ecosystem"
authors = ["PocketJS contributors"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "pocket_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
anyhow = "1.0.100"
base64 = "0.22"
ed25519-dalek = "2"
fs2 = "0.4"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
semver = "1"
flate2 = "1.1"
sha2 = "0.10"
plist = "=1.10.0"
tempfile = "3.20"
serde_json = "1.0"
legacy-ios-exploits = { git = "https://github.com/HalfSweet/Legacy-iOS-Kit-rs.git", branch = "main" }
legacy-ios-firmware = { git = "https://github.com/HalfSweet/Legacy-iOS-Kit-rs.git", branch = "main" }
legacy-ios-image = { git = "https://github.com/HalfSweet/Legacy-iOS-Kit-rs.git", branch = "main" }
legacy-ios-workflows = { git = "https://github.com/HalfSweet/Legacy-iOS-Kit-rs.git", branch = "main" }
idevice = { version = "=0.1.65", default-features = false }
legacy-ios-assets = { git = "https://github.com/HalfSweet/Legacy-iOS-Kit-rs.git", branch = "main" }
legacy-ios-core = { git = "https://github.com/HalfSweet/Legacy-iOS-Kit-rs.git", branch = "main" }
legacy-ios-services = { git = "https://github.com/HalfSweet/Legacy-iOS-Kit-rs.git", branch = "main", features = ["legacy-tls"] }
legacy-ios-transport = { git = "https://github.com/HalfSweet/Legacy-iOS-Kit-rs.git", branch = "main" }
serde = { version = "1.0.228", features = ["derive"] }
suppaftp = { version = "11.0.0", default-features = false, features = ["tokio"] }
tauri = { version = "2.11.5", features = ["protocol-asset"] }
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["rt", "time", "sync", "macros", "io-util", "fs", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
legacy-ios-restore = { git = "https://github.com/HalfSweet/Legacy-iOS-Kit-rs.git", branch = "main" }
serde_json = "1.0"
