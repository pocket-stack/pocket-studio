[package]
name = "pocket-studio"
version = "0.1.0"
description = "The desktop bridge for the Pocket device ecosystem"
authors = ["PocketJS contributors"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "pocket_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
anyhow = "1.0.100"
flate2 = "1.1"
sha2 = "0.10"
tempfile = "3.20"
tar = "0.4"
serde_json = "1.0"
legacy-ios-exploits = { git = "https://github.com/HalfSweet/Legacy-iOS-Kit-rs", rev = "42b423fbfdcda66f1fb7cca2b605654dd905087e" }
legacy-ios-firmware = { git = "https://github.com/HalfSweet/Legacy-iOS-Kit-rs", rev = "42b423fbfdcda66f1fb7cca2b605654dd905087e" }
legacy-ios-image = { git = "https://github.com/HalfSweet/Legacy-iOS-Kit-rs", rev = "42b423fbfdcda66f1fb7cca2b605654dd905087e" }
legacy-ios-workflows = { git = "https://github.com/HalfSweet/Legacy-iOS-Kit-rs", rev = "42b423fbfdcda66f1fb7cca2b605654dd905087e" }
idevice = { version = "=0.1.65", default-features = false }
legacy-ios-assets = { git = "https://github.com/HalfSweet/Legacy-iOS-Kit-rs", rev = "42b423fbfdcda66f1fb7cca2b605654dd905087e" }
legacy-ios-core = { git = "https://github.com/HalfSweet/Legacy-iOS-Kit-rs", rev = "42b423fbfdcda66f1fb7cca2b605654dd905087e" }
legacy-ios-services = { git = "https://github.com/HalfSweet/Legacy-iOS-Kit-rs", rev = "42b423fbfdcda66f1fb7cca2b605654dd905087e", features = ["legacy-tls"] }
legacy-ios-transport = { git = "https://github.com/HalfSweet/Legacy-iOS-Kit-rs", rev = "42b423fbfdcda66f1fb7cca2b605654dd905087e" }
serde = { version = "1.0.228", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["rt", "time", "sync", "macros", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1.0"
hfsplus = { version = "0.2.4", features = ["testutil"] }
