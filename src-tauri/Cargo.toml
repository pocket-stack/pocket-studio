[package]
name = "pocket-studio"
version = "0.1.0"
description = "The desktop bridge for the Pocket device ecosystem"
authors = ["PocketJS contributors"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "pocket_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
anyhow = "1.0.100"
flate2 = "1.1"
sha2 = "0.10"
tempfile = "3.20"
serde_json = "1.0"
legacy-ios-exploits = { path = "../../../GitHub/Legacy-iOS-Kit-rs/crates/exploits" }
legacy-ios-firmware = { path = "../../../GitHub/Legacy-iOS-Kit-rs/crates/firmware" }
legacy-ios-image = { path = "../../../GitHub/Legacy-iOS-Kit-rs/crates/image" }
legacy-ios-workflows = { path = "../../../GitHub/Legacy-iOS-Kit-rs/crates/workflows" }
idevice = { version = "=0.1.65", default-features = false }
legacy-ios-assets = { path = "../../../GitHub/Legacy-iOS-Kit-rs/crates/assets" }
legacy-ios-core = { path = "../../../GitHub/Legacy-iOS-Kit-rs/crates/core" }
legacy-ios-services = { path = "../../../GitHub/Legacy-iOS-Kit-rs/crates/services", features = ["legacy-tls"] }
legacy-ios-transport = { path = "../../../GitHub/Legacy-iOS-Kit-rs/crates/transport" }
serde = { version = "1.0.228", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["rt", "time", "sync", "macros", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1.0"
