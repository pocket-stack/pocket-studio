<svg
  xmlns="http://www.w3.org/2000/svg"
  width="92"
  height="92"
  viewBox="0 0 128 128"
  fill="none"
>
  <g transform="rotate(-90 64 64)" stroke-width="8">
    <circle cx="64" cy="64" r="54" style="stroke: var(--ps-line, #d6d6d6)" />
    <circle
      cx="64"
      cy="64"
      r="54"
      pathLength="100"
      stroke-linecap="round"
      stroke-dasharray="100"
      style="
        stroke: var(--countdown-color, #2f6fd6);
        stroke-dashoffset: var(--countdown-offset, 0);
        transition: stroke-dashoffset 1s linear;
      "
    />
  </g>
